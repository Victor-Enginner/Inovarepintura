# Deploy Netlify. O plugin oficial trata do App Router, ISR e imagens.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"

# Assets com hash no nome podem ser cacheados para sempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Derivados da cutscene e da galeria: nomes estáveis, logo cache curto com
# revalidação, para poderem ser substituídos sem esperar por expiração.
[[headers]]
  for = "/cutscene/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
