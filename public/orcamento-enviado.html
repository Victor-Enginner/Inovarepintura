<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pedido recebido | Inovare Pintura</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #171a1f; background: #f6f4ef; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; }
      main { width: min(100%, 42rem); padding: clamp(2rem, 7vw, 4rem); border: 1px solid #dde4e6; border-radius: 1rem; background: white; text-align: center; }
      p { color: #4a5259; line-height: 1.7; }
      a { display: inline-flex; min-height: 2.75rem; align-items: center; justify-content: center; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: .5rem; background: #06234a; color: white; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 3px solid #0d7c7a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <!--
      Netlify Forms + Next.js 16: esta declaração tem de ser um ficheiro HTML
      estático em public/. O adaptador não deteta de forma fiável formulários
      renderizados em páginas Next.js prerenderizadas. O nome e os campos têm
      de corresponder exatamente ao QuoteForm.tsx (ADR-007).
    -->
    <form name="orcamento" method="POST" data-netlify="true" netlify-honeypot="empresa" hidden>
      <input type="hidden" name="form-name" value="orcamento" />
      <input type="text" name="nome" />
      <input type="tel" name="telefone" />
      <select name="tipo">
        <option value="">Escolha</option>
        <option value="Outro">Outro</option>
      </select>
      <textarea name="mensagem"></textarea>
      <input type="text" name="empresa" />
    </form>

    <main>
      <h1>Pedido recebido.</h1>
      <p>Obrigado pelo contacto. Vamos ligar-lhe de volta assim que possível.</p>
      <p>Se precisar de acrescentar informação, volte à página inicial e fale connosco por telefone ou WhatsApp.</p>
      <a href="/">Voltar à página inicial</a>
    </main>
  </body>
</html>
