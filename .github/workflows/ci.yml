name: CI

# Gate de qualidade do CLAUDE.md §3 (Gate D).
#
# Corre em cada push para main e em cada pull request. A Netlify — quando o
# repositório estiver ligado por Git — faz o deploy por conta própria; este
# workflow existe para nada chegar à produção sem passar por lint, typecheck,
# testes unitários, build e e2e. Ver docs/DEPLOY.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificação completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build de produção
        run: npm run build

      # A build acima é pré-requisito do servidor que os testes e2e usam.
      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e
        run: npm run test:e2e

      - name: Guardar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
